<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-label="현재 구현 — 관리자 시나리오 편집기 (맵+구역+시나리오 통합, as-built 2026-06-22)">
  <style>
    text{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:13px;fill:#1f2933}
