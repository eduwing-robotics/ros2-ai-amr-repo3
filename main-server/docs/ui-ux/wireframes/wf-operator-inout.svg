<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-label="운영자 지속 셸 - 입출고 드로어 열림">
  <style>
    text{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:13px;fill:#1f2933}
    .t{font-weight:700;font-size:16px}.m{fill:#8a94a6;font-size:12px}.s{font-size:11px}
    .side{fill:#f5f7fa;stroke:#e1e6ec}.panel{fill:#fff;stroke:#d4d9e0}.field{fill:#fff;stroke:#c7cdd6}
    .btn{fill:#e8f0fe;stroke:#3b6fd4}.btnt{fill:#1c4fb0;font-weight:600;font-size:12px}
    .pri{fill:#3b6fd4;stroke:#2c58b8}.tag{fill:#fdecea;stroke:#e3b4ad}.tagt{fill:#c0392b;font-size:10px;font-weight:700}
    .banner{fill:#fdf3e7;stroke:#e0a85b}.ok{fill:#e6f4ea;stroke:#4ca56a}.dash{stroke:#c0392b;stroke-dasharray:5 3;fill:none}.ann{fill:#c0392b;font-size:11px}
    rect{stroke-width:1}
  </style>
  <rect x="0.5" y="0.5" width="919" height="539" fill="#fff" stroke="#d4d9e0"/>
  <!-- header -->
  <rect x="0" y="0" width="920" height="46" fill="#1f2933"/>
  <text x="16" y="29" fill="#fff" class="t">LMS Control</text>
  <rect x="150" y="12" width="58" height="24" rx="12" class="pri"/><text x="179" y="29" fill="#fff" text-anchor="middle" font-size="12">운영</text>
  <rect x="214" y="12" width="58" height="24" rx="12" fill="none" stroke="#5a6473"/><text x="243" y="29" fill="#c7cdd6" text-anchor="middle" font-size="12">관리</text>
  <text x="700" y="29" fill="#9fb0c9" font-size="12">● 온라인 2/2 · 이동서버 연결</text>
  <!-- slim nav (입출고 active) -->
  <rect x="0" y="46" width="72" height="494" class="side"/>
  <text x="36" y="86" class="m" text-anchor="middle">관제</text>
  <rect x="6" y="110" width="60" height="46" rx="6" class="btn"/><text x="36" y="138" class="btnt" text-anchor="middle">입출고</text>
  <text x="36" y="190" class="m" text-anchor="middle">작업</text>
  <!-- map canvas behind (always visible, right portion uncovered) -->
  <rect x="84" y="58" width="634" height="402" rx="6" class="panel"/>
  <rect x="92" y="66" width="618" height="386" rx="4" fill="#eef1f5" stroke="#d4d9e0"/>
  <circle cx="540" cy="200" r="8" fill="#3b6fd4"/><text x="540" y="226" text-anchor="middle" class="s">tb3_2</text>
  <rect x="500" y="300" width="16" height="16" rx="2" fill="#1fa8a0"/><text x="508" y="332" text-anchor="middle" class="s">출고장</text>
  <rect x="410" y="74" width="130" height="22" rx="4" fill="#fff" stroke="#d4d9e0"/><text x="420" y="89" class="s">맵 계속 보임 ↗</text>
  <!-- drawer shadow + drawer (over map left) -->
  <rect x="88" y="62" width="310" height="398" rx="8" fill="#000" opacity="0.06"/>
  <rect x="84" y="58" width="310" height="398" rx="8" fill="#fff" stroke="#c7cdd6"/>
  <text x="100" y="86" class="t">입출고 요청</text>
  <rect x="368" y="68" width="20" height="20" rx="4" class="field"/><text x="378" y="83" text-anchor="middle" class="m">✕</text>
  <!-- error banner O6 -->
  <rect x="100" y="98" width="278" height="46" rx="6" class="banner"/>
  <text x="112" y="118" fill="#b9770e" class="s">⚠ 재고 부족: BOX_A 2개 부족</text>
  <rect x="112" y="124" width="22" height="14" rx="3" class="tag"/><text x="123" y="135" text-anchor="middle" class="tagt">O6</text>
  <rect x="300" y="122" width="66" height="18" rx="4" class="btn"/><text x="333" y="135" text-anchor="middle" class="btnt">재고 보기</text>
  <!-- toggle O2/O3 -->
  <rect x="100" y="158" width="66" height="26" rx="13" class="pri"/><text x="133" y="175" fill="#fff" text-anchor="middle" font-size="12">● 입고</text>
  <rect x="174" y="158" width="66" height="26" rx="13" class="field"/><text x="207" y="175" fill="#6b7480" text-anchor="middle" font-size="12">○ 출고</text>
  <rect x="252" y="160" width="40" height="16" rx="3" class="tag"/><text x="272" y="172" text-anchor="middle" class="tagt">O2·O3</text>
  <!-- fields -->
  <text x="100" y="208" class="m">품목</text>
  <rect x="100" y="214" width="160" height="30" rx="4" class="field"/><text x="112" y="234">BOX_A ▾</text>
  <text x="272" y="208" class="m">수량</text>
  <rect x="272" y="214" width="106" height="30" rx="4" class="field"/><text x="284" y="234">3</text>
  <!-- checkbox -->
  <rect x="100" y="258" width="16" height="16" rx="3" class="field"/><path d="M103 266 l3 4 l6 -7" stroke="#3b6fd4" stroke-width="2" fill="none"/>
  <text x="124" y="271" font-size="12">생성 후 자동 시작</text>
  <!-- run + FS->BS toward map -->
  <rect x="100" y="288" width="140" height="40" rx="6" class="pri"/><text x="170" y="313" fill="#fff" text-anchor="middle" font-weight="700" font-size="15">실행</text>
  <line x1="244" y1="308" x2="404" y2="240" class="dash"/>
  <text x="250" y="300" class="ann">FS → BS</text>
  <text x="250" y="316" class="ann s">결과는 맵에 표시</text>
  <!-- divider -->
  <line x1="100" y1="346" x2="378" y2="346" stroke="#e1e6ec"/>
  <!-- recent order O4 -->
  <text x="100" y="368" class="m">최근 주문</text>
  <rect x="100" y="376" width="278" height="64" rx="6" fill="#f5f7fa" stroke="#e1e6ec"/>
  <text x="112" y="400">#12  입고 BOX_A ×3</text>
  <rect x="112" y="410" width="150" height="12" rx="6" class="field"/><rect x="112" y="410" width="100" height="12" rx="6" fill="#3b6fd4"/>
  <rect x="280" y="408" width="80" height="16" rx="8" class="ok"/><text x="320" y="420" fill="#2f7d4d" text-anchor="middle" class="s">RUNNING</text>
  <rect x="112" y="426" width="22" height="12" rx="3" class="tag"/><text x="123" y="436" text-anchor="middle" class="tagt">O4</text>
  <!-- right fixed rail O1 (always) -->
  <rect x="730" y="46" width="190" height="494" class="side"/>
  <text x="744" y="70" class="t" font-size="14">실시간 모니터</text>
  <rect x="884" y="56" width="22" height="16" rx="3" class="tag"/><text x="895" y="68" text-anchor="middle" class="tagt">O1</text>
  <rect x="744" y="82" width="162" height="96" rx="4" fill="#eef1f5" stroke="#d4d9e0"/><text x="825" y="134" text-anchor="middle" class="m">카메라 LIVE</text>
  <rect x="744" y="188" width="162" height="64" rx="6" class="field"/><text x="756" y="210">tb3_1 · IDLE</text><text x="756" y="230" class="m">배터리 92%</text><circle cx="894" cy="204" r="5" fill="#4ca56a"/>
  <rect x="744" y="260" width="162" height="64" rx="6" class="field"/><text x="756" y="282">tb3_2 · RUNNING</text><text x="756" y="302" class="m">task #12 · 80%</text><circle cx="894" cy="276" r="5" fill="#3b6fd4"/>
  <text x="744" y="352" class="m">이동서버 · 연결</text>
  <!-- legend -->
  <rect x="84" y="490" width="14" height="14" rx="3" class="btn"/><text x="106" y="502" font-size="12">사용자 조작 (FS)</text>
  <rect x="300" y="490" width="14" height="14" rx="3" class="panel"/><text x="322" y="502" font-size="12">시스템 표시 (BS)</text>
  <rect x="520" y="490" width="22" height="14" rx="3" class="tag"/><text x="548" y="502" class="m">= 대응 Job</text>
</svg>
