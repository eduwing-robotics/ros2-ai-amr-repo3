  <text x="20" y="129" class="m">슬롯·재고·품목</text>
  <text x="24" y="160" class="m">동작 정의</text>
  <rect x="8" y="172" width="134" height="28" rx="6" fill="#eae6fd" stroke="#7a4fd4"/><text x="24" y="191" fill="#5b3bd4" font-weight="600" font-size="12">시나리오</text>
  <text x="24" y="220" class="m">로봇·카메라</text>
