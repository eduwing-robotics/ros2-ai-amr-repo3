<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-label="관리자 시스템 화면 와이어프레임 — 서버 연결 상태 · DB 테이블">
  <style>
    text{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:13px;fill:#1f2933}
    .t{font-weight:700;font-size:16px}.m{fill:#8a94a6;font-size:12px}.s{font-size:11px}.xs{font-size:10px}
    .side{fill:#f5f7fa;stroke:#e1e6ec}.panel{fill:#fff;stroke:#d4d9e0}.field{fill:#fff;stroke:#c7cdd6}
    .btn{fill:#e8f0fe;stroke:#3b6fd4}.btnt{fill:#1c4fb0;font-weight:600;font-size:12px}
    .pri{fill:#3b6fd4;stroke:#2c58b8}
    .tag{fill:#eae6fd;stroke:#b4adee}.tagt{fill:#5b3bd4;font-size:10px;font-weight:700}
    .head{fill:#f0f2f5;stroke:#d4d9e0}
    .ok{fill:#e6f4ea;stroke:#4ca56a}.okt{fill:#2f7d4d;font-size:11px}
    .warn{fill:#fdf3e7;stroke:#e0a85b}.warnt{fill:#b9770e;font-size:11px}
    .note{fill:#f5f7fa;stroke:#e1e6ec}
    rect{stroke-width:1}
  </style>
  <rect x="0.5" y="0.5" width="919" height="539" fill="#fff" stroke="#d4d9e0"/>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="46" fill="#1f2933"/>
  <text x="16" y="29" fill="#fff" class="t">LMS Control</text>
  <rect x="150" y="12" width="58" height="24" rx="12" fill="none" stroke="#5a6473"/>
  <text x="179" y="29" fill="#c7cdd6" text-anchor="middle" font-size="12">운영</text>
  <rect x="214" y="12" width="58" height="24" rx="12" fill="#7a4fd4" stroke="#5b3bd4"/>
  <text x="243" y="29" fill="#fff" text-anchor="middle" font-size="12">관리</text>
  <text x="700" y="29" fill="#9fb0c9" font-size="12">관리자 · 설치/유지보수</text>

  <!-- Admin sidebar -->
  <rect x="0" y="46" width="150" height="494" class="side"/>
  <text x="16" y="70" class="m">관리 모드</text>
  <text x="24" y="94" class="m">맵 &amp; 구역</text>
  <text x="20" y="120" class="m">슬롯·재고·품목</text>
  <text x="24" y="146" class="m">동작 정의</text>
  <text x="24" y="172" class="m">시나리오</text>
  <text x="24" y="198" class="m">로봇·카메라</text>
  <rect x="8" y="210" width="134" height="28" rx="6" fill="#eae6fd" stroke="#7a4fd4"/>
  <text x="75" y="229" fill="#5b3bd4" font-weight="600" font-size="12" text-anchor="middle">시스템</text>
  <line x1="16" y1="250" x2="134" y2="250" stroke="#d4d9e0"/>
  <text x="24" y="268" class="m">기록</text>

  <!-- Page title -->
  <text x="166" y="78" class="t">시스템</text>
  <rect x="216" y="66" width="22" height="16" rx="3" class="tag"/>
  <text x="227" y="78" text-anchor="middle" class="tagt">A</text>
  <text x="252" y="78" class="m">서버 연결 점검 · DB 탐색 — 데이터 수정은 각 관리 화면에서</text>

  <!-- ===== LEFT PANEL: 서버 연결 상태 ===== -->
  <rect x="166" y="92" width="386" height="356" rx="6" class="panel"/>
  <text x="180" y="114" class="t" font-size="14">서버 연결 상태</text>
  <rect x="352" y="100" width="22" height="16" rx="3" class="tag"/>
  <text x="363" y="112" text-anchor="middle" class="tagt">A</text>

  <!-- Connection table header -->
  <rect x="180" y="122" width="358" height="24" class="head"/>
  <text x="190" y="138" class="m">서비스</text>
  <text x="310" y="138" class="m">주소</text>
  <text x="450" y="138" class="m">상태</text>
  <text x="510" y="138" class="m">최근 확인</text>

  <!-- Row 1: Main DB -->
  <rect x="180" y="146" width="358" height="32" class="field"/>
  <text x="190" y="166">Main DB</text>
  <text x="310" y="166" class="s">postgresql://smartfactory/main</text>
  <rect x="446" y="151" width="50" height="18" rx="9" class="ok"/>
  <text x="471" y="163" text-anchor="middle" class="okt">정상</text>
  <text x="510" y="166" class="s">방금 전</text>

  <!-- Row 2: Movement tb3_1 -->
  <rect x="180" y="178" width="358" height="32" class="field"/>
  <text x="190" y="198">Movement · tb3_1</text>
  <text x="310" y="198" class="s">http://tb3_1:8080</text>
  <rect x="446" y="183" width="50" height="18" rx="9" class="ok"/>
  <text x="471" y="195" text-anchor="middle" class="okt">연결</text>
  <text x="510" y="198" class="s">10:34</text>

  <!-- Row 3: Movement tb3_2 -->
  <rect x="180" y="210" width="358" height="32" class="field"/>
  <text x="190" y="230">Movement · tb3_2</text>
  <text x="310" y="230" class="s">http://tb3_2:8080</text>
  <rect x="446" y="215" width="50" height="18" rx="9" class="ok"/>
  <text x="471" y="227" text-anchor="middle" class="okt">연결</text>
  <text x="510" y="230" class="s">10:34</text>

  <!-- Row 4: Camera -->
  <rect x="180" y="242" width="358" height="32" class="field"/>
  <text x="190" y="262">Camera</text>
  <text x="310" y="262" class="s">http://cam-host:8088</text>
  <rect x="446" y="247" width="50" height="18" rx="9" class="ok"/>
  <text x="471" y="259" text-anchor="middle" class="okt">연결</text>
  <text x="510" y="262" class="s">10:33</text>

  <!-- Reconnect button -->
  <rect x="180" y="284" width="120" height="32" rx="6" class="btn"/>
  <text x="240" y="305" text-anchor="middle" class="btnt">재연결 시도</text>
  <text x="316" y="305" class="m">선택된 서비스에 재연결 요청</text>

  <!-- Divider -->
  <line x1="180" y1="330" x2="534" y2="330" stroke="#e1e6ec"/>

  <!-- System mode section -->
  <text x="180" y="352" class="s" font-weight="600">운영 모드</text>
  <rect x="290" y="338" width="90" height="24" rx="12" class="ok"/>
  <text x="335" y="354" text-anchor="middle" fill="#2f7d4d" font-size="12" font-weight="600">정상 운영</text>
  <text x="180" y="382" class="m">dry_run 모드: 이동 명령이 Movement에 전달되지 않고 시뮬레이션으로 실행</text>
  <rect x="290" y="394" width="100" height="24" rx="12" class="warn"/>
  <text x="340" y="409" text-anchor="middle" fill="#b9770e" font-size="12" font-weight="600">드라이런 (예시)</text>
  <text x="180" y="432" class="m">모드 전환은 서버 환경 변수(`MOVEMENT_MODE`)로 제어</text>

  <!-- ===== RIGHT PANEL: DB 테이블 ===== -->
  <rect x="566" y="92" width="338" height="356" rx="6" class="panel"/>
  <text x="580" y="114" class="t" font-size="14">DB 테이블</text>
  <rect x="880" y="100" width="22" height="16" rx="3" class="tag"/>
  <text x="891" y="112" text-anchor="middle" class="tagt">A</text>

  <!-- Table list header -->
  <rect x="580" y="122" width="310" height="24" class="head"/>
  <text x="590" y="138" class="m">테이블</text>
  <text x="756" y="138" class="m">행 수</text>
  <text x="824" y="138" class="m">탐색</text>

  <!-- Table rows -->
  <rect x="580" y="146" width="310" height="24" class="field"/>
  <text x="590" y="162">robots</text>
  <text x="770" y="162" class="s" text-anchor="end">2</text>
  <rect x="802" y="148" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="161" text-anchor="middle" class="btnt">탐색</text>

  <rect x="580" y="170" width="310" height="24" class="field"/>
  <text x="590" y="186">camera_sources</text>
  <text x="770" y="186" class="s" text-anchor="end">2</text>
  <rect x="802" y="172" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="185" text-anchor="middle" class="btnt">탐색</text>

  <rect x="580" y="194" width="310" height="24" class="field"/>
  <text x="590" y="210">waypoints</text>
  <text x="770" y="210" class="s" text-anchor="end">8</text>
  <rect x="802" y="196" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="209" text-anchor="middle" class="btnt">탐색</text>

  <rect x="580" y="218" width="310" height="24" class="field"/>
  <text x="590" y="234">storage_slots</text>
  <text x="770" y="234" class="s" text-anchor="end">4</text>
  <rect x="802" y="220" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="233" text-anchor="middle" class="btnt">탐색</text>

  <rect x="580" y="242" width="310" height="24" class="field"/>
  <text x="590" y="258">items</text>
  <text x="770" y="258" class="s" text-anchor="end">3</text>
  <rect x="802" y="244" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="257" text-anchor="middle" class="btnt">탐색</text>

  <rect x="580" y="266" width="310" height="24" class="field"/>
  <text x="590" y="282">inventory</text>
  <text x="770" y="282" class="s" text-anchor="end">6</text>
  <rect x="802" y="268" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="281" text-anchor="middle" class="btnt">탐색</text>

  <rect x="580" y="290" width="310" height="24" class="field"/>
  <text x="590" y="306">work_orders</text>
  <text x="770" y="306" class="s" text-anchor="end">12</text>
  <rect x="802" y="292" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="305" text-anchor="middle" class="btnt">탐색</text>

  <rect x="580" y="314" width="310" height="24" class="field"/>
  <text x="590" y="330">tasks</text>
  <text x="770" y="330" class="s" text-anchor="end">18</text>
  <rect x="802" y="316" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="329" text-anchor="middle" class="btnt">탐색</text>

  <rect x="580" y="338" width="310" height="24" class="field"/>
  <text x="590" y="354">scenario_presets</text>
  <text x="770" y="354" class="s" text-anchor="end">5</text>
  <rect x="802" y="340" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="353" text-anchor="middle" class="btnt">탐색</text>

  <rect x="580" y="362" width="310" height="24" class="field"/>
  <text x="590" y="378">events</text>
  <text x="770" y="378" class="s" text-anchor="end">143</text>
  <rect x="802" y="364" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="377" text-anchor="middle" class="btnt">탐색</text>

  <rect x="580" y="386" width="310" height="24" class="field"/>
  <text x="590" y="402">movement_commands</text>
  <text x="770" y="402" class="s" text-anchor="end">89</text>
  <rect x="802" y="388" width="48" height="18" rx="4" class="btn"/>
  <text x="826" y="401" text-anchor="middle" class="btnt">탐색</text>

  <!-- Note -->
  <rect x="580" y="420" width="310" height="24" rx="4" fill="#f5f7fa" stroke="#e1e6ec"/>
  <text x="735" y="436" text-anchor="middle" class="m">데이터 수정 → 각 관리 화면</text>

  <!-- Legend -->
  <rect x="166" y="488" width="14" height="14" rx="3" class="btn"/>
  <text x="186" y="500" font-size="12">사용자 조작 (FS)</text>
  <rect x="380" y="488" width="14" height="14" rx="3" class="panel"/>
  <text x="400" y="500" font-size="12">시스템 표시 (BS)</text>
  <rect x="594" y="488" width="22" height="14" rx="3" class="tag"/>
  <text x="622" y="500" class="m">= 대응 Job</text>
</svg>
