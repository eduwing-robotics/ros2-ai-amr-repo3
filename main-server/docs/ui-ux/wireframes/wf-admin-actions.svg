<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-label="관리자 동작 정의 화면 와이어프레임">
  <style>
    text{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:13px;fill:#1f2933}
    .t{font-weight:700;font-size:16px}.m{fill:#8a94a6;font-size:12px}.s{font-size:11px}.xs{font-size:10px}
    .side{fill:#f5f7fa;stroke:#e1e6ec}.panel{fill:#fff;stroke:#d4d9e0}.field{fill:#fff;stroke:#c7cdd6}
    .btn{fill:#e8f0fe;stroke:#3b6fd4}.btnt{fill:#1c4fb0;font-weight:600;font-size:12px}
    .pri{fill:#3b6fd4;stroke:#2c58b8}.tag{fill:#eae6fd;stroke:#b4adee}.tagt{fill:#5b3bd4;font-size:10px;font-weight:700}
    .head{fill:#f0f2f5;stroke:#d4d9e0}.sel{fill:#eef4ff;stroke:#3b6fd4}
    rect{stroke-width:1}
  </style>
  <rect x="0.5" y="0.5" width="919" height="539" fill="#fff" stroke="#d4d9e0"/>
  <rect x="0" y="0" width="920" height="46" fill="#1f2933"/>
  <text x="16" y="29" fill="#fff" class="t">LMS Control</text>
  <rect x="150" y="12" width="58" height="24" rx="12" fill="none" stroke="#5a6473"/><text x="179" y="29" fill="#c7cdd6" text-anchor="middle" font-size="12">운영</text>
  <rect x="214" y="12" width="58" height="24" rx="12" fill="#7a4fd4" stroke="#5b3bd4"/><text x="243" y="29" fill="#fff" text-anchor="middle" font-size="12">관리</text>
  <text x="700" y="29" fill="#9fb0c9" font-size="12">관리자 · 설치/유지보수</text>
  <!-- sidebar -->
  <rect x="0" y="46" width="150" height="494" class="side"/>
  <text x="16" y="70" class="m">관리 모드</text>
  <text x="24" y="99" class="m">맵 &amp; 구역</text>
  <text x="20" y="129" class="m">슬롯·재고·품목</text>
  <rect x="8" y="142" width="134" height="28" rx="6" fill="#eae6fd" stroke="#7a4fd4"/><text x="24" y="161" fill="#5b3bd4" font-weight="600" font-size="12">동작 정의</text>
  <text x="24" y="190" class="m">시나리오</text>
  <text x="24" y="220" class="m">로봇·카메라</text>
  <text x="24" y="250" class="m">시스템</text>
  <!-- title -->
  <text x="166" y="80" class="t">동작 정의</text>
  <rect x="262" y="68" width="22" height="16" rx="3" class="tag"/><text x="273" y="80" text-anchor="middle" class="tagt">A5</text>
  <text x="300" y="80" class="m">action_type + 파라미터 스키마 (모션 시퀀스는 Movement)</text>
  <!-- left: action_type list -->
  <rect x="166" y="96" width="260" height="364" rx="6" class="panel"/>
  <text x="180" y="118" class="t" font-size="14">동작 목록</text>
  <rect x="180" y="128" width="232" height="24" class="head"/><text x="190" y="145" class="m">action_type</text><text x="360" y="145" class="m">파라미터</text>
  <rect x="180" y="152" width="232" height="26" class="field"/><text x="190" y="170">move</text><text x="372" y="170">0</text>
  <rect x="180" y="178" width="232" height="26" class="sel"/><text x="190" y="196" font-weight="600">pickup</text><text x="372" y="196">4</text>
  <rect x="180" y="204" width="232" height="26" class="field"/><text x="190" y="222">dropoff</text><text x="372" y="222">2</text>
  <rect x="180" y="230" width="232" height="26" class="field"/><text x="190" y="248">wait</text><text x="372" y="248">1</text>
  <rect x="180" y="256" width="232" height="26" class="field"/><text x="190" y="274">inspection</text><text x="372" y="274">1</text>
  <rect x="180" y="300" width="120" height="32" rx="6" class="btn"/><text x="240" y="321" text-anchor="middle" class="btnt">+ 동작 추가</text>
  <!-- right: param schema editor for pickup -->
  <rect x="440" y="96" width="464" height="364" rx="6" class="panel"/>
  <text x="454" y="118" class="t" font-size="14">pickup · 파라미터 스키마</text>
  <rect x="454" y="128" width="436" height="24" class="head"/><text x="464" y="145" class="m">key</text><text x="600" y="145" class="m">라벨</text><text x="760" y="145" class="m">타입</text><text x="850" y="145" class="m"></text>
  <rect x="454" y="152" width="436" height="26" class="field"/><text x="464" y="170">slot</text><text x="600" y="170">슬롯</text><text x="760" y="170">text</text><text x="876" y="170" fill="#c0392b" class="s">✕</text>
  <rect x="454" y="178" width="436" height="26" class="field"/><text x="464" y="196">lift_height</text><text x="600" y="196">리프트 높이</text><text x="760" y="196">number</text><text x="876" y="196" fill="#c0392b" class="s">✕</text>
  <rect x="454" y="204" width="436" height="26" class="field"/><text x="464" y="222">approach_offset</text><text x="600" y="222">접근 오프셋</text><text x="760" y="222">number</text><text x="876" y="222" fill="#c0392b" class="s">✕</text>
  <rect x="454" y="230" width="436" height="26" class="field"/><text x="464" y="248">aruco_marker_id</text><text x="600" y="248">아루코 id</text><text x="760" y="248">text</text><text x="876" y="248" fill="#c0392b" class="s">✕</text>
  <text x="454" y="296" class="m">파라미터 추가</text>
  <rect x="454" y="304" width="130" height="30" rx="4" class="field"/><text x="466" y="324" class="m">key</text>
  <rect x="592" y="304" width="130" height="30" rx="4" class="field"/><text x="604" y="324" class="m">라벨</text>
  <rect x="730" y="304" width="90" height="30" rx="4" class="field"/><text x="742" y="324" class="m">타입 ▾</text>
  <rect x="828" y="304" width="62" height="30" rx="4" class="btn"/><text x="859" y="324" text-anchor="middle" class="btnt">추가</text>
  <rect x="454" y="346" width="90" height="34" rx="6" class="pri"/><text x="499" y="368" fill="#fff" text-anchor="middle" font-weight="700" font-size="13">저장</text>
  <text x="454" y="412" class="m">모션 시퀀스(리프트 들고 후진)는 Movement 서버가 펼친다.</text>
  <text x="454" y="430" class="m">여기서는 파라미터 스키마만 정의한다.</text>
  <!-- legend -->
  <rect x="166" y="486" width="14" height="14" rx="3" class="btn"/><text x="188" y="498" class="s">사용자 조작 (FS)</text>
  <rect x="360" y="486" width="14" height="14" rx="3" class="panel"/><text x="382" y="498" class="s">시스템 표시 (BS)</text>
  <rect x="560" y="486" width="22" height="14" rx="3" class="tag"/><text x="588" y="498" class="s">= 대응 Job</text>
</svg>
