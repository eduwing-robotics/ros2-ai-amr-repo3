schema_version: vision-sources.v1
sources:
  - source_id: global_cam_01
    kind: global_rgb
    robot_id: null
    frame_id: global_camera_frame
    enabled: true
    target_fps: 10.0
    notes: GoPro/global RGB overview evidence with crop-first smart ROI views for lift/pallet analysis
    budgets:
      target_fps_semantics: legacy_ai_ingest_default
      preview_media_fps: 30.0
      ai_monitor_fps: 5.0
      evidence_imgsz: 960
      browser_primary_transport_semantics: legacy_internal_rosbridge_metadata
    physical_input:
      topic: /global_camera/image_raw
      message_type: sensor_msgs/msg/Image
      content_type: image/raw
      preferred_transport: raw
    browser:
      legacy_topic: null
      legacy_message_type: null
      primary_transport: rosbridge
    normalized_topics:
      image: /sf/vision/sources/global_cam_01/image/compressed
      overlay: /sf/vision/sources/global_cam_01/overlay/compressed
    evidence_event_topic: /sf/vision/events
    views:
      - view_id: full
        kind: full_frame
        can_confirm_internal_color_indexing: false
      - view_id: lift_roi
        kind: smart_tracked_roi_crop
        parent_view: full
        can_confirm_internal_color_indexing: false
      - view_id: pallet_zoom
        kind: tracked_roi_crop
        parent_view: full
        can_confirm_internal_color_indexing: true

  - source_id: global_depth_01
    kind: realsense_rgbd
    robot_id: null
    frame_id: global_depth_camera_frame
    enabled: false
    target_fps: 15.0
    notes: planned D435 global full/ROI crop views; disabled until mounted and calibrated
    budgets:
      target_fps_semantics: planned_ingest_default
      preview_media_fps: 15.0
      ai_monitor_fps: 5.0
      browser_primary_transport_semantics: disabled_planned_source_metadata
    physical_input:
      topic: null
      message_type: sensor_msgs/msg/Image
      content_type: image/raw
      preferred_transport: raw
    browser:
      legacy_topic: null
      legacy_message_type: null
      primary_transport: http_mjpeg_gateway
    normalized_topics:
      image: /sf/vision/sources/global_depth_01/image/compressed
      overlay: /sf/vision/sources/global_depth_01/overlay/compressed
    evidence_event_topic: /sf/vision/events
    views:
      - view_id: full
        kind: full_frame
        can_confirm_internal_color_indexing: false
      - view_id: pallet_zoom
        kind: tracked_roi_crop
        parent_view: full
        can_confirm_internal_color_indexing: true

  - source_id: tb3_1_picam
    kind: robot_pi_camera
    robot_id: tb3_1
    frame_id: tb3_1_pi_camera_optical_frame
    enabled: true
    target_fps: 10.0
    notes: front marker/dock/local item evidence
    budgets:
      target_fps_semantics: legacy_ai_ingest_default
      preview_media_fps: 30.0
      ai_monitor_fps: 10.0
      browser_primary_transport_semantics: legacy_internal_rosbridge_metadata
    physical_input:
      topic: /tb3_1/camera/image_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      content_type: image/jpeg
      preferred_transport: compressed
    browser:
      legacy_topic: /mission/tb3_1/camera/compressed
      legacy_message_type: sensor_msgs/msg/CompressedImage
      primary_transport: rosbridge
    normalized_topics:
      image: /sf/vision/sources/tb3_1_picam/image/compressed
      overlay: /sf/vision/sources/tb3_1_picam/overlay/compressed
    evidence_event_topic: /sf/vision/events

  - source_id: tb3_2_picam
    kind: robot_pi_camera
    robot_id: tb3_2
    frame_id: tb3_2_pi_camera_optical_frame
    enabled: true
    target_fps: 10.0
    notes: front marker/dock/local item evidence
    budgets:
      target_fps_semantics: legacy_ai_ingest_default
      preview_media_fps: 30.0
      ai_monitor_fps: 10.0
      browser_primary_transport_semantics: legacy_internal_rosbridge_metadata
    physical_input:
      topic: /tb3_2/camera/image_raw/compressed
      message_type: sensor_msgs/msg/CompressedImage
      content_type: image/jpeg
      preferred_transport: compressed
    browser:
      legacy_topic: /mission/tb3_2/camera/compressed
      legacy_message_type: sensor_msgs/msg/CompressedImage
      primary_transport: rosbridge
    normalized_topics:
      image: /sf/vision/sources/tb3_2_picam/image/compressed
      overlay: /sf/vision/sources/tb3_2_picam/overlay/compressed
    evidence_event_topic: /sf/vision/events
